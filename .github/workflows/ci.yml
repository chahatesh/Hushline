name: Checks and Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:ui
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify real offline speech on CPU
        shell: pwsh
        run: |
          $env:HUSHLINE_OFFLINE_TEST_ROOT = Join-Path $env:RUNNER_TEMP 'hushline-offline-test'
          $env:HUSHLINE_OFFLINE_TEST_WAV = Join-Path $env:RUNNER_TEMP 'hushline-jfk.wav'
          Invoke-WebRequest 'https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.9.2/samples/jfk.wav' -OutFile $env:HUSHLINE_OFFLINE_TEST_WAV
          cargo test --locked --manifest-path src-tauri/Cargo.toml real_offline_transcription -- --ignored --nocapture --test-threads=1
      - run: npm run package
      - run: npm run portable
      - uses: actions/upload-artifact@v4
        with:
          name: Hush-windows-x64-unverified
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            artifacts/*.zip
          if-no-files-found: error
