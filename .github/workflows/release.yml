name: Verified release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-release.mjs
  build:
    needs: acceptance
    uses: ./.github/workflows/sign-windows.yml
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Hush-signed-windows-x64
          path: release-files
      - name: Verify trusted Windows signatures before publication
        run: powershell -NoProfile -File scripts/verify-signed-release.ps1 -Directory release-files
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          body: |
            Windows distribution files passed trusted Authenticode verification.
            [Code signing policy](https://github.com/chahatesh/Hushline/blob/main/CODE_SIGNING_POLICY.md) · [Privacy](https://github.com/chahatesh/Hushline/blob/main/PRIVACY.md).
            Check SHA256SUMS.txt and the Digital Signatures tab before installing.
          files: release-files/**/*
